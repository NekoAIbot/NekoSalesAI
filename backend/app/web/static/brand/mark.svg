<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="Nera Emblem">
  <defs>
    <linearGradient id="neraGradLeft" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="neraGradDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="neraGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="neraGradSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="neraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowOver" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#03161F" flood-opacity="0.45"/>
    </filter>
</defs>

  <!-- Left Ribbon Stem -->
  <path d="M 22 92 C 16 92 12 87 12 80 L 12 36 C 12 25 21 16 32 16 C 41 16 48 22 50 30 L 50 76 C 50 85 43 92 34 92 Z" fill="url(#neraGradLeft)"/>

  <!-- Right Ribbon Stem -->
  <path d="M 70 92 C 61 92 54 85 54 76 L 54 44 C 54 35 61 28 70 28 C 79 28 86 35 86 44 L 86 80 C 86 87 81 92 75 92 Z" fill="url(#neraGradRight)"/>

  <!-- Diagonal Sweeping Ribbon Fold (with depth shadow over left stem) -->
  <path d="M 32 16 C 40 16 48 21 52 28 L 84 76 C 88 82 92 85 96 85 C 102 85 106 80 106 74 L 106 48 C 106 43 102 40 98 40 C 94 40 90 43 90 48 L 90 64 L 62 22 C 55 12 44 8 32 16 Z"
        fill="url(#neraGradDiag)" filter="url(#shadowOver)"/>

  <!-- Radiant Spark Accent (Intelligence symbol) -->
  <path d="M 104 10 Q 104 20 114 20 Q 104 20 104 30 Q 104 20 94 20 Q 104 20 104 10 Z" fill="url(#neraGradSpark)" filter="url(#neraGlow)"/>
  <circle cx="104" cy="20" r="1.5" fill="#FFFFFF"/>

</svg>
