name: CRM Security Verification

on:
  push:
    branches:
      - 'verify/crm-security-ci'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-crm-security:
    name: CRM Tenant Isolation & Security Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      TESTING: "true"
      ENVIRONMENT: "test"
      MAIL_BACKEND: "memory"
      SECRET_KEY: "ci-ephemeral-test-key-minimum-32-characters"
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Approved CRM Security Tests Only
        working-directory: backend
        run: |
          pytest tests/test_crm_tenant_isolation.py tests/test_leads_api.py -v --tb=short
