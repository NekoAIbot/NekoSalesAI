name: Organic Onboarding & Frontend Verification

on:
  push:
    branches:
      - 'feat/organic-onboarding-email-verification'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-verify:
    name: Frontend Syntax & Onboarding Tests (Node 22)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Print Node.js version
        run: node --version

      - name: Check JavaScript syntax across active SPA, Greenfield /v2, legacy, and tests
        run: |
          find frontend/app frontend/src frontend/src-legacy frontend/tests -name '*.js' -print0 \
            | xargs -0 -n 1 node --check

      - name: Run Greenfield frontend asset & module integrity test
        run: node frontend/tests/frontend.test.js

      - name: Run organic onboarding & email verification frontend tests
        run: node --test frontend/tests/onboarding.test.js

  backend-onboarding-verify:
    name: Backend Onboarding & Email Verification Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      TESTING: "true"
      ENVIRONMENT: "test"
      MAIL_BACKEND: "memory"
      SECRET_KEY: "ci-ephemeral-test-key-minimum-32-characters"
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run email verification, journey, and non-payment regression suites
        working-directory: backend
        run: |
          pytest tests/test_email_verification.py tests/test_fresh_customer_journey.py tests/test_crm_tenant_isolation.py tests/test_mail.py tests/test_pricing.py tests/test_catalog.py tests/test_quotes.py tests/test_widget.py -v --tb=short
